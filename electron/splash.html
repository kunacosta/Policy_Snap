<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #ffffff;
      user-select: none;
    }

    .logo {
      width: 280px;
      margin-bottom: 32px;
      opacity: 0.95;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .title span {
      color: #1D9E75;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.4px;
      margin-bottom: 52px;
    }

    .bar-track {
      width: 220px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #1D9E75;
      border-radius: 4px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(29, 158, 117, 0.5);
    }

    /* Fallback animation only when IPC is unavailable (non-Electron browsers) */
    @media not all and (-webkit-app-region: drag) {
      .bar-fill.no-ipc {
        animation: load 8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    }

    @keyframes load {
      0%   { width: 0%; }
      20%  { width: 35%; }
      50%  { width: 62%; }
      80%  { width: 85%; }
      100% { width: 95%; }
    }

    .status {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <img class="logo" src="../public/splash-logo.png" alt="Onyxx Tech" onerror="this.style.display='none'" />
  <div class="title">Policy<span>Snap</span></div>
  <div class="subtitle">Insurance Summary Generator · Onyxx Tech</div>
  <div class="bar-track">
    <div class="bar-fill" id="bar"></div>
  </div>
  <div class="status" id="status">Starting up, please wait…</div>

  <script>
    const bar    = document.getElementById('bar');
    const status = document.getElementById('status');

    if (window.electronAPI && window.electronAPI.onProgress) {
      // Real progress from main process
      window.electronAPI.onProgress(function(percent) {
        bar.style.width = percent + '%';
        if (percent >= 100) {
          status.textContent = 'Ready!';
          status.style.color = '#1D9E75';
        } else if (percent >= 70) {
          status.textContent = 'Almost ready…';
        } else if (percent >= 30) {
          status.textContent = 'Loading server…';
        }
      });
    } else {
      // Fallback: CSS animation (non-Electron context)
      bar.classList.add('no-ipc');
    }
  </script>
</body>
</html>
